[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RET", "SIM", "ASYNC", "LOG", "PIE"]
ignore = [
    # The transport layer carries long descriptive log/error strings; reflowing
    # the 2500-line API module is out of scope for this change.
    "E501",
    # Pre-existing patterns in the monolith, tracked for the planned refactor.
    "B023",
    "RET504",
    "SIM105",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components"]

[tool.ruff.lint.per-file-ignores]
# The existing suite uses unittest-style asserts and long inline fixtures.
"tests/*" = ["PT009", "PT027", "B011", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/integration talks to a real router and must not run in CI.
addopts = "--ignore=tests/integration"

[tool.mypy]
# Full strict run: mypy --config-file pyproject.toml custom_components/zte_5g_router
# Strict island that currently passes (legacy modules still need typed payloads):
# mypy --config-file pyproject.toml --follow-imports=silent \
#   custom_components/zte_5g_router/{const,identity,sms_events,entity,diagnostics,coordinator}.py
python_version = "3.13"
files = ["custom_components/zte_5g_router"]
strict = true
show_error_codes = true
show_column_numbers = true
warn_unreachable = true
warn_unused_configs = true

# Bootstrap for a custom component: Home Assistant and aiohttp are only
# available at runtime. This is removed in a core PR with real HA stubs.
[[tool.mypy.overrides]]
module = ["homeassistant.*", "aiohttp.*", "voluptuous.*"]
ignore_missing_imports = true
