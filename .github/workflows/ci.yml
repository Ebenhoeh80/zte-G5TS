name: CI
# Copyright (C) 2026 Daniel Ebenhöh
# SPDX-License-Identifier: MIT

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build dashboard
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: pip install -r requirements_test.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  mypy:
    name: Mypy strict
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Mypy strict (all source files)
        run: mypy --config-file pyproject.toml custom_components/zte_5g_router

  test:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Run tests with coverage
        run: >-
          pytest tests -q
          --cov=custom_components/zte_5g_router
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-fail-under=95
      - name: Enforce 95% coverage per module
        run: |
          python - <<'PY'
          import json
          import sys

          with open("coverage.json", encoding="utf-8") as handle:
              files = json.load(handle)["files"]
          low = {
              name: data["summary"]["percent_covered"]
              for name, data in files.items()
              if data["summary"]["percent_covered"] < 95
          }
          if low:
              print("Modules below 95% coverage:", low)
              sys.exit(1)
          print("Every module has at least 95% coverage")
          PY
