name: Validate with hassfest

on:
  push:
  pull_request:
  schedule:
    - cron:  '0 0 * * *'

permissions:
  contents: read

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
        - uses: "actions/checkout@v7"
        # Pinned to the master commit reviewed on 2026-11-26; Dependabot can
        # still propose updates to this SHA.
        - uses: "home-assistant/actions/hassfest@9e9565e68f5a70d874202871f4c4064d23814235" # master
