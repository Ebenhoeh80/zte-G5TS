name: Build HACS release zip

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag matches manifest version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import json; print(json.load(open("custom_components/zte_5g_router/manifest.json"))["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match manifest version $version" >&2
            exit 1
          fi

      - name: Build zip (root files, no folder)
        run: |
          set -euxo pipefail
          DOMAIN="zte_5g_router"
          ZIP_NAME="${DOMAIN}.zip"

          rm -f "${ZIP_NAME}"
          rm -rf dist
          mkdir -p dist

          # Put integration files directly in ZIP root (no top-level folder)
          cp -a "custom_components/${DOMAIN}/." "dist/"

          (cd dist && zip -r "../${ZIP_NAME}" . \
            -x "**/__pycache__/**" "**/*.pyc" "**/.DS_Store")

          # Sanity checks
          unzip -l "${ZIP_NAME}" | head -n 50
          unzip -l "${ZIP_NAME}" | grep -q "^ *[0-9].*manifest.json$"

      - name: Upload zip to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: zte_5g_router.zip
